name: Generate optimized preview assets

on:
  push:
    branches:
      - task-hero-logo-performance-preview

permissions:
  contents: write

jobs:
  optimize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install image optimizer
        run: npm install --no-save --package-lock=false sharp@0.33.5

      - name: Generate WebP assets and switch visible image references
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import sharp from 'sharp';

          const size = (file) => fs.statSync(file).size;
          const kb = (bytes) => `${(bytes / 1024).toFixed(1)} KB`;

          const heroSource = 'src/assets/hero.png';
          const heroOutput = 'src/assets/hero.webp';
          const logoSource = 'src/assets/logo.png';
          const logoOutput = 'src/assets/logo.webp';
          const publicLogoSource = 'public/divine-ink-logo.png';
          const publicLogoOutput = 'public/divine-ink-logo.webp';

          const heroMeta = await sharp(heroSource).metadata();
          const logoMeta = await sharp(logoSource).metadata();

          await sharp(heroSource)
            .webp({ quality: 88, effort: 6, smartSubsample: true })
            .toFile(heroOutput);

          await sharp(logoSource)
            .webp({ lossless: true, effort: 6 })
            .toFile(logoOutput);

          await sharp(publicLogoSource)
            .webp({ lossless: true, effort: 6 })
            .toFile(publicLogoOutput);

          const appPath = 'src/App.jsx';
          let app = fs.readFileSync(appPath, 'utf8');
          app = app.replace("import logo from './assets/logo.png';", "import logo from './assets/logo.webp';");
          app = app.replace("import hero from './assets/hero.png';", "import hero from './assets/hero.webp';");
          fs.writeFileSync(appPath, app);

          function walk(directory) {
            for (const entry of fs.readdirSync(directory, { withFileTypes: true })) {
              const full = path.join(directory, entry.name);
              if (entry.isDirectory()) walk(full);
              else if (/\.(jsx|js)$/.test(entry.name)) {
                const before = fs.readFileSync(full, 'utf8');
                const after = before.replaceAll('src="/divine-ink-logo.png"', 'src="/divine-ink-logo.webp"');
                if (after !== before) fs.writeFileSync(full, after);
              }
            }
          }
          walk('src');

          const report = [
            'Hero/logo performance preview',
            `Hero dimensions: ${heroMeta.width}x${heroMeta.height}`,
            `Hero PNG: ${kb(size(heroSource))}`,
            `Hero WebP: ${kb(size(heroOutput))}`,
            `Hero reduction: ${((1 - size(heroOutput) / size(heroSource)) * 100).toFixed(1)}%`,
            `Logo dimensions: ${logoMeta.width}x${logoMeta.height}`,
            `Logo PNG: ${kb(size(logoSource))}`,
            `Logo WebP lossless: ${kb(size(logoOutput))}`,
            `Logo reduction: ${((1 - size(logoOutput) / size(logoSource)) * 100).toFixed(1)}%`,
            `Public logo WebP lossless: ${kb(size(publicLogoOutput))}`,
            'Visible layout/CSS/content: unchanged',
            'Original PNG files retained as fallback/social/PWA assets',
          ].join('\n');
          fs.writeFileSync('asset-performance-report.txt', `${report}\n`);
          console.log(report);
          NODE

      - name: Build and run regression checks
        run: |
          npm run build
          npm run check:regression

      - name: Commit generated preview assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/assets/hero.webp src/assets/logo.webp public/divine-ink-logo.webp src/App.jsx src asset-performance-report.txt
          git commit -m "Generate optimized hero and logo preview assets"
          git push
