name: Update piercing multi-photo preview

on:
  push:
    branches:
      - task-piercing-admin-preview

permissions:
  contents: write

jobs:
  update_preview:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out preview branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0

      - name: Apply requested preview fixes
        run: node scripts/apply-piercing-multiphoto-preview.mjs

      - name: Install dependencies
        run: npm ci

      - name: Build and run regression checks
        run: npm run check

      - name: Commit verified preview fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx scripts/verify-production-build.mjs
          git commit -m "Support multiple piercing photos and simplify portfolio filters"
          git push
