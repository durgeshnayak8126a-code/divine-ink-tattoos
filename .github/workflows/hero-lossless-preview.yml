name: Regenerate lossless hero preview

on:
  push:
    branches:
      - task-hero-logo-performance-preview

permissions:
  contents: write

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install image optimizer
        run: npm install --no-save --package-lock=false sharp@0.33.5

      - name: Regenerate hero as lossless WebP
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import sharp from 'sharp';

          const src = 'src/assets/hero.png';
          const out = 'src/assets/hero.webp';
          const before = fs.statSync(src).size;

          await sharp(src)
            .webp({ lossless: true, effort: 6 })
            .toFile(out);

          const after = fs.statSync(out).size;
          console.log(`Hero PNG: ${(before / 1024).toFixed(1)} KB`);
          console.log(`Hero lossless WebP: ${(after / 1024).toFixed(1)} KB`);
          console.log('Hero quality mode: lossless');
          NODE

      - name: Build and run regression checks
        run: npm run check

      - name: Commit lossless hero preview
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/assets/hero.webp
          git commit -m "Use lossless hero image for performance preview"
          git push
