name: Contact admin only preview v3

on:
  push:
    branches: [task-contact-admin-only-preview]

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: task-contact-admin-only-preview
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
      - name: Apply contact-only patch
        run: python scripts/apply-contact-admin-only-preview.py
      - run: npm ci
      - run: npm run check
      - name: Commit verified contact-only changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx src/admin/contact/ContactPage.jsx scripts/verify-production-build.mjs
          git commit -m "Connect Contact admin without changing homepage content"
          git push
