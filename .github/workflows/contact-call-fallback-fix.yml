name: Contact Book on Call fallback fix

on:
  push:
    branches: [task-contact-admin-only-preview]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: task-contact-admin-only-preview
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
      - name: Apply Book on Call fallback fix
        run: python .github/scripts/contact_call_fix.py
      - run: npm ci
      - run: npm run check
      - name: Commit verified fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx src/admin/contact/ContactPage.jsx scripts/verify-production-build.mjs
          git commit -m "Restore Book on Call fallback in Contact preview"
          git push origin HEAD:task-contact-admin-only-preview
