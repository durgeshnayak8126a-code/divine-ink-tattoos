name: Finalize admin CMS preview

on:
  push:
    branches: [task-connect-admin-cms-preview]

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: task-connect-admin-cms-preview
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
      - name: Fix booking WhatsApp target
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/App.jsx')
          s = p.read_text()
          old = "window.open(`https://wa.me/${phone}?text=${encodeURIComponent(bookingMessage())}`, '_blank', 'noopener,noreferrer');"
          new = "window.open(`https://wa.me/${whatsappPhone}?text=${encodeURIComponent(bookingMessage())}`, '_blank', 'noopener,noreferrer');"
          if old not in s:
              raise SystemExit('Expected booking WhatsApp line not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - run: npm ci
      - run: npm run check
      - name: Commit verified fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx
          git commit -m "Use managed WhatsApp number for booking form"
          git push
