name: Final preview polish

on:
  push:
    branches:
      - task-piercing-admin-preview

permissions:
  contents: write

jobs:
  polish_preview:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout preview branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0

      - name: Apply final preview polish
        run: node scripts/apply-preview-polish.mjs

      - name: Install dependencies
        run: npm ci

      - name: Build and verify
        run: npm run check

      - name: Commit verified changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx src/admin/piercing/PiercingPage.jsx scripts/verify-production-build.mjs
          git commit -m "Polish piercing preview and portfolio navigation"
          git push
