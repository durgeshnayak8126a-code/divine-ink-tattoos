name: Fix grouped piercing photos preview

on:
  push:
    branches:
      - fix-piercing-grouped-photos-preview

permissions:
  contents: write

jobs:
  apply_and_verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout preview branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0

      - name: Apply piercing grouping fix
        run: node scripts/apply-piercing-grouping-fix.mjs

      - name: Install dependencies
        run: npm ci

      - name: Build and verify
        run: npm run check

      - name: Commit verified changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx src/App.css src/piercingData.js src/usePublicCms.js src/admin/piercing/PiercingPage.jsx src/admin/piercing/piercingService.js scripts/verify-production-build.mjs
          git commit -m "Fix grouped piercing photos and live removal"
          git push
