name: Prepare multipage website preview

on:
  push:
    branches:
      - task-multipage-website-preview

permissions:
  contents: write

jobs:
  build_preview:
    if: github.actor == 'durgeshnayak8126a-code'
    runs-on: ubuntu-latest
    steps:
      - name: Check out preview branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0

      - name: Apply multipage source changes
        run: node scripts/apply-multipage-preview.mjs

      - name: Install dependencies
        run: npm ci

      - name: Build and run regression checks
        run: npm run check

      - name: Commit preview implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx src/main.jsx src/sitePages.js package.json scripts/generate-main-page-html.mjs scripts/generate-sitemap.mjs scripts/verify-production-build.mjs
          git commit -m "Add preview-only multipage website structure"
          git push
