name: Apply admin CMS wiring preview

on:
  push:
    branches: [task-connect-admin-cms-preview]

permissions:
  contents: write

jobs:
  apply_and_verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout preview branch
        uses: actions/checkout@v4
        with:
          ref: task-connect-admin-cms-preview
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
      - name: Fix temporary verification helper
        run: |
          sed -i 's/const publicCmsSource/const cmsLoaderSource/g' scripts/apply-admin-cms-wiring.mjs
          sed -i 's/publicCmsSource.includes/cmsLoaderSource.includes/g' scripts/apply-admin-cms-wiring.mjs
      - name: Apply CMS wiring
        run: |
          node scripts/apply-admin-cms-wiring.mjs
          sed -i "s/const phone = '918445702782';/const defaultPhone = '918445702782';/" scripts/verify-production-build.mjs
      - name: Install dependencies
        run: npm ci
      - name: Build and verify
        run: npm run check
      - name: Commit verified changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx scripts/verify-production-build.mjs
          git commit -m "Connect admin CMS modules to public website"
          git push
